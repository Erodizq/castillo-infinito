<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Castillo Infinito de Drácula</title>
<style>
/* styles.css — El Castillo Infinito de Drácula */

/* ── TOKENS ──────────────────────────────────────────────────────────────── */
:root {
  --bg-profundo:   #0d0507;
  --bg-panel:      #150b0d;
  --bg-panel2:     #1e1012;
  --bg-card:       #251518;
  --borde:         #3a1f22;
  --borde-oro:     #7a5a1a;
  --oro:           #c8a028;
  --oro-claro:     #e8c848;
  --rojo:          #8b1a1a;
  --rojo-claro:    #cc3333;
  --crema:         #e8d5b0;
  --crema-apagada: #a89070;
  --verde:         #2a5a1a;
  --verde-claro:   #4a9a2a;
  --azul:          #1a2a5a;
  --azul-claro:    #3a5aaa;
  --morado:        #3a1a5a;
  --morado-claro:  #7a3aaa;
  --peligro:       #cc2200;
  --bien:          #44aa22;
  --ruido-color:   #aa6600;

  --fuente-display: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
  --fuente-cuerpo:  Georgia, 'Times New Roman', serif;
  --fuente-ui:      'Segoe UI', system-ui, sans-serif;

  --radio:     6px;
  --radio-lg:  10px;
  --sombra:    0 2px 12px rgba(0,0,0,0.6);
  --sombra-lg: 0 4px 24px rgba(0,0,0,0.8);
}

/* ── RESET ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg-profundo);
  color: var(--crema);
  font-family: var(--fuente-cuerpo);
  font-size: 14px;
  display: flex;
  flex-direction: column;
}

/* ── CABECERA ─────────────────────────────────────────────────────────────── */
header {
  background: var(--bg-panel);
  border-bottom: 1px solid var(--borde-oro);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

.titulo-juego {
  font-family: var(--fuente-display);
  font-size: 18px;
  color: var(--oro);
  letter-spacing: 0.04em;
}

.titulo-proto {
  font-size: 10px;
  color: var(--crema-apagada);
  margin-left: 8px;
}

header button {
  background: var(--rojo);
  color: var(--crema);
  border: 1px solid var(--rojo-claro);
  padding: 6px 14px;
  border-radius: var(--radio);
  font-family: var(--fuente-cuerpo);
  font-size: 12px;
  cursor: pointer;
  transition: background 0.2s;
}
header button:hover { background: var(--rojo-claro); }

/* ── LAYOUT PRINCIPAL ────────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 240px 1fr 220px;
  grid-template-rows: 1fr;
  flex: 1;
  overflow: hidden;
  gap: 0;
}

/* ── PANEL IZQUIERDO — RECURSOS ──────────────────────────────────────────── */
.panel-recursos {
  background: var(--bg-panel);
  border-right: 1px solid var(--borde);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 12px;
  gap: 10px;
}

.seccion-titulo {
  font-family: var(--fuente-display);
  font-size: 11px;
  color: var(--oro);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 4px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--borde);
}

/* Tracks de recursos */
.recurso {
  background: var(--bg-card);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 8px 10px;
}

.recurso-label {
  font-size: 10px;
  color: var(--crema-apagada);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

.pips {
  display: flex;
  gap: 4px;
}

.pip {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid;
  transition: all 0.2s;
}

.pip.pip-vida.activo  { background: var(--rojo-claro); border-color: #ff6666; box-shadow: 0 0 6px rgba(204,51,51,0.5); }
.pip.pip-vida.inactivo{ background: transparent; border-color: #3a1a1a; }
.pip.pip-det.activo   { background: var(--azul-claro); border-color: #6688cc; box-shadow: 0 0 6px rgba(58,90,170,0.5); }
.pip.pip-det.inactivo { background: transparent; border-color: #1a1a3a; }

/* Track numérico */
.track-num {
  font-family: var(--fuente-display);
  font-size: 28px;
  font-weight: bold;
  color: var(--crema);
  text-align: center;
  line-height: 1;
}
.track-num.warn   { color: var(--ruido-color); }
.track-num.danger { color: var(--rojo-claro); text-shadow: 0 0 8px rgba(204,51,51,0.6); }

.recurso-sublabel {
  font-size: 9px;
  color: var(--crema-apagada);
  text-align: center;
  margin-top: 2px;
}

/* Pistas y turno */
.counters {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.counter {
  background: var(--bg-card);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 6px 8px;
  text-align: center;
}

.counter-val {
  font-family: var(--fuente-display);
  font-size: 20px;
  color: var(--oro);
}

.counter-label {
  font-size: 9px;
  color: var(--crema-apagada);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* Estado de Pánico */
#estado-panico {
  display: none;
  background: linear-gradient(135deg, #3a0a0a, #1a0505);
  border: 2px solid var(--rojo-claro);
  border-radius: var(--radio);
  padding: 8px;
  text-align: center;
  font-family: var(--fuente-display);
  font-size: 13px;
  color: var(--rojo-claro);
  animation: pulso 1.5s infinite;
}
#estado-panico.visible { display: block; }

@keyframes pulso {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* ── ZONA CENTRAL — MAPA ─────────────────────────────────────────────────── */
.zona-central {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #0a0305;
}

.mapa-wrapper {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#mapa-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* Panel de carta robada */
#panel-carta {
  display: none;
  background: var(--bg-panel2);
  border-top: 1px solid var(--borde-oro);
  padding: 12px 16px;
  flex-shrink: 0;
}
#panel-carta.visible { display: block; }

.carta-robada {
  display: flex;
  align-items: center;
  gap: 12px;
}

.carta-icono { font-size: 28px; flex-shrink: 0; }

.carta-titulo {
  font-family: var(--fuente-display);
  font-size: 15px;
  color: var(--oro);
  font-weight: bold;
}

.carta-puertas {
  font-size: 11px;
  color: var(--crema-apagada);
  margin-top: 2px;
}

.carta-desc-panel {
  font-size: 12px;
  color: var(--crema);
  margin-top: 4px;
  font-style: italic;
}

/* Zona de acciones */
#zona-acciones {
  background: var(--bg-panel);
  border-top: 1px solid var(--borde);
  padding: 10px 14px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  flex-shrink: 0;
}

/* ── BOTONES ─────────────────────────────────────────────────────────────── */
.btn {
  font-family: var(--fuente-cuerpo);
  font-size: 12px;
  padding: 8px 14px;
  border-radius: var(--radio);
  border: 1px solid;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.btn-primary {
  background: var(--rojo);
  color: var(--crema);
  border-color: var(--rojo-claro);
}
.btn-primary:hover { background: var(--rojo-claro); }

.btn-secondary {
  background: transparent;
  color: var(--crema);
  border-color: var(--borde-oro);
}
.btn-secondary:hover { background: var(--borde-oro); color: #000; }

.btn-danger {
  background: #2a0a0a;
  color: var(--rojo-claro);
  border-color: var(--rojo);
}
.btn-danger:hover { background: var(--rojo); color: var(--crema); }

.btn-victoria {
  background: linear-gradient(135deg, #1a4a1a, #2a7a2a);
  color: #aaffaa;
  border-color: var(--verde-claro);
  font-weight: bold;
  animation: brillo 2s infinite;
}

.btn-especial {
  background: var(--morado);
  color: #dda0ff;
  border-color: var(--morado-claro);
}
.btn-especial:hover { background: var(--morado-claro); }

@keyframes brillo {
  0%, 100% { box-shadow: 0 0 6px rgba(74,154,42,0.4); }
  50% { box-shadow: 0 0 16px rgba(74,154,42,0.9); }
}

/* ── PANEL DERECHO — INVENTARIO + LOG ────────────────────────────────────── */
.panel-derecho {
  background: var(--bg-panel);
  border-left: 1px solid var(--borde);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-seccion {
  padding: 10px;
  border-bottom: 1px solid var(--borde);
  overflow-y: auto;
}

.panel-seccion-log {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
  min-height: 0;
}

/* Tesoros */
.carta-tesoro {
  background: var(--bg-card);
  border: 1px solid var(--borde-oro);
  border-radius: var(--radio);
  padding: 6px 8px;
  margin-bottom: 4px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.carta-tesoro:hover { border-color: var(--oro); }
.carta-tesoro .carta-nombre {
  display: block;
  font-size: 11px;
  color: var(--oro-claro);
  font-weight: bold;
}
.carta-tesoro .carta-desc {
  display: block;
  font-size: 9px;
  color: var(--crema-apagada);
  margin-top: 2px;
}

/* Reserva */
.carta-reserva {
  background: var(--bg-card);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 6px 8px;
  margin-bottom: 4px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: border-color 0.15s;
}
.carta-reserva:hover { border-color: var(--borde-oro); }
.carta-reserva .carta-nombre { font-size: 11px; color: var(--crema); }
.carta-reserva .carta-puertas { font-size: 10px; color: var(--crema-apagada); }

.empty-slot {
  font-size: 10px;
  color: var(--crema-apagada);
  font-style: italic;
  padding: 4px 0;
}

/* Log */
#log-contenido { display: flex; flex-direction: column; gap: 3px; }

.log-entrada {
  font-size: 10px;
  padding: 3px 5px;
  border-radius: 3px;
  border-left: 2px solid transparent;
  line-height: 1.4;
  font-family: var(--fuente-ui);
}

.log-normal       { color: var(--crema-apagada); border-color: var(--borde); }
.log-info         { color: var(--crema); border-color: var(--borde-oro); }
.log-peligro      { color: #ff8888; border-color: var(--rojo); background: rgba(139,26,26,0.15); }
.log-bien         { color: #88ff88; border-color: var(--verde-claro); background: rgba(42,90,26,0.15); }
.log-ruido        { color: #ffaa44; border-color: var(--ruido-color); }
.log-dracula      { color: #cc44ff; border-color: var(--morado-claro); background: rgba(58,26,90,0.2); font-weight: bold; }
.log-pista        { color: #44aaff; border-color: var(--azul-claro); background: rgba(26,42,90,0.2); }
.log-descubrimiento { color: #cc88ff; border-color: var(--morado); }
.log-victoria     { color: #aaffaa; border-color: var(--verde-claro); font-weight: bold; }
.log-turno        { color: var(--borde-oro); border-color: var(--borde-oro); text-align: center; font-style: italic; }
.log-inicio       { color: var(--oro); font-style: italic; }

/* ── MODALES ─────────────────────────────────────────────────────────────── */
#modal-overlay, #overlay-fin {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
#modal-overlay.visible, #overlay-fin.visible {
  display: flex;
}

.modal-caja {
  background: var(--bg-panel2);
  border: 1px solid var(--borde-oro);
  border-radius: var(--radio-lg);
  padding: 24px;
  max-width: 360px;
  width: 90%;
  box-shadow: var(--sombra-lg);
}

#modal-titulo {
  font-family: var(--fuente-display);
  font-size: 15px;
  color: var(--crema);
  margin-bottom: 16px;
  line-height: 1.4;
}

#modal-botones {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.btn-modal { width: 100%; text-align: center; padding: 10px; }

/* Fin de partida */
.fin-caja {
  background: var(--bg-panel2);
  border: 2px solid;
  border-radius: var(--radio-lg);
  padding: 32px;
  text-align: center;
  max-width: 380px;
  width: 90%;
  box-shadow: var(--sombra-lg);
}

.fin-titulo {
  font-family: var(--fuente-display);
  font-size: 28px;
  margin-bottom: 12px;
}
.fin-titulo.victoria { color: var(--verde-claro); }
.fin-titulo.derrota  { color: var(--rojo-claro); }

#fin-subtitulo {
  font-size: 13px;
  color: var(--crema-apagada);
  margin-bottom: 24px;
  line-height: 1.5;
}

.fin-caja .btn { width: 100%; text-align: center; padding: 12px; font-size: 14px; }

/* ── SCROLLBAR ────────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg-profundo); }
::-webkit-scrollbar-thumb { background: var(--borde); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--borde-oro); }

/* ── RESPONSIVE BÁSICO ────────────────────────────────────────────────────── */
@media (max-width: 700px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
  .panel-recursos { flex-direction: row; flex-wrap: wrap; overflow-x: auto; padding: 8px; gap: 6px; border-right: none; border-bottom: 1px solid var(--borde); max-height: 120px; }
  .panel-derecho { display: none; }
}
</style>
<body>


  <!-- CABECERA -->
  <header>
    <div>
      <span class="titulo-juego">El Castillo Infinito de Drácula</span>
      <span class="titulo-proto">— Alpha 0.1</span>
    </div>
    <button id="btn-nueva-partida">↺ Nueva partida</button>
  </header>

  <!-- APP PRINCIPAL -->
  <div class="app">

    <!-- PANEL IZQUIERDO: RECURSOS -->
    <aside class="panel-recursos">

      <div class="seccion-titulo">Recursos</div>

      <!-- Vida -->
      <div class="recurso">
        <div class="recurso-label">❤️ Vida</div>
        <div class="pips" id="pips-vida"></div>
      </div>

      <!-- Determinación -->
      <div class="recurso">
        <div class="recurso-label">🔵 Determinación</div>
        <div class="pips" id="pips-det"></div>
      </div>

      <!-- Estado Pánico -->
      <div id="estado-panico">⚠️ PÁNICO</div>

      <!-- Ruido -->
      <div class="recurso">
        <div class="recurso-label">🔔 Ruido</div>
        <div class="track-num" id="track-ruido">0</div>
        <div class="recurso-sublabel">Evento en 5 / 10 / 15</div>
      </div>

      <!-- Distancia Drácula -->
      <div class="recurso">
        <div class="recurso-label">🧛 Distancia de Drácula</div>
        <div class="track-num" id="track-dist">5</div>
        <div class="recurso-sublabel">Pierde si llega a 0</div>
      </div>

      <!-- Pistas y Turno -->
      <div class="counters">
        <div class="counter">
          <div class="counter-val" id="counter-pistas">0/3</div>
          <div class="counter-label">🔑 Pistas</div>
        </div>
        <div class="counter">
          <div class="counter-val" id="counter-turno">1</div>
          <div class="counter-label">Turno</div>
        </div>
      </div>

      <!-- Botón Salida -->
      <button id="btn-salida" class="btn btn-victoria" style="display:none"
        onclick="Effects.usarSalida()">
        🚗 Usar Salida
      </button>

    </aside>

    <!-- ZONA CENTRAL: MAPA -->
    <main class="zona-central">

      <div class="mapa-wrapper">
        <canvas id="mapa-canvas"></canvas>
      </div>

      <!-- Carta robada actual -->
      <div id="panel-carta"></div>

      <!-- Botones de acción -->
      <div id="zona-acciones"></div>

    </main>

    <!-- PANEL DERECHO: INVENTARIO + LOG -->
    <aside class="panel-derecho">

      <!-- Tesoros -->
      <div class="panel-seccion" style="max-height: 200px">
        <div class="seccion-titulo">💰 Tesoros (0/5)</div>
        <div id="lista-tesoros"></div>
      </div>

      <!-- Reserva -->
      <div class="panel-seccion" style="max-height: 120px">
        <div class="seccion-titulo">📦 Reserva (0/2)</div>
        <div id="lista-reserva"></div>
      </div>

      <!-- Log -->
      <div class="panel-seccion-log">
        <div class="seccion-titulo">📜 Registro</div>
        <div id="log-contenido"></div>
      </div>

    </aside>

  </div>

  <!-- MODAL DE ELECCIÓN -->
  <div id="modal-overlay">
    <div class="modal-caja">
      <div id="modal-titulo"></div>
      <div id="modal-botones"></div>
    </div>
  </div>

  <!-- OVERLAY FIN DE PARTIDA -->
  <div id="overlay-fin">
    <div class="fin-caja">
      <div id="fin-titulo" class="fin-titulo"></div>
      <div id="fin-subtitulo"></div>
      <button id="btn-reiniciar" class="btn btn-primary">↺ Jugar de nuevo</button>
    </div>
  </div>

  <!-- SCRIPTS (orden de dependencias) -->


<script>
// state.js — Fuente de verdad de la partida

const State = {
  // Recursos del jugador
  vida: 5,
  determinacion: 3,
  ruido: 0,
  distanciaDracula: 5,
  pistas: 0,
  enPanico: false,
  salidaDisponible: false,

  // Inventario
  tesoros: [],        // cartas de tesoro activas
  reserva: [],        // habitaciones guardadas (máx 2)

  // Mapa
  habitacionesColocadas: [],  // { id, x, y, puertas, tipo, nombre }
  puertasAbiertas: [],        // { x, y, direccion }

  // Mazos (se inicializan en cards.js y se barajan)
  mazoCastillo: [],
  mazoTesoros: [],
  mazoAmenazas: [],
  mazoPistas: [],
  mazoDescubrimientos: [],
  mazoEventosDracula: [],
  pilaDescarte: [],

  // Control de turno
  turno: 1,
  faseActual: 'inicio',     // inicio | colocar | resolver | fin
  descartadoEsteTurno: false,
  reservaBloqueda: false,   // por Trampa de cadenas
  accionEsconditeUsada: false,
  relojDeSolUsos: 0,        // para el Tesoro Reloj de sol

  // Log
  log: [],

  // Flags de victoria/derrota
  partidaTerminada: false,
  resultado: null,  // 'victoria' | 'derrota'
  razonDerrota: null,

  reset() {
    this.vida = 5;
    this.determinacion = 3;
    this.ruido = 0;
    this.distanciaDracula = 5;
    this.pistas = 0;
    this.enPanico = false;
    this.salidaDisponible = false;
    this.tesoros = [];
    this.reserva = [];
    this.habitacionesColocadas = [];
    this.puertasAbiertas = [];
    this.mazoCastillo = [];
    this.mazoTesoros = [];
    this.mazoAmenazas = [];
    this.mazoPistas = [];
    this.mazoDescubrimientos = [];
    this.mazoEventosDracula = [];
    this.pilaDescarte = [];
    this.turno = 1;
    this.faseActual = 'inicio';
    this.descartadoEsteTurno = false;
    this.reservaBloqueada = false;
    this.accionEsconditeUsada = false;
    this.relojDeSolUsos = 0;
    this.log = [];
    this.partidaTerminada = false;
    this.resultado = null;
    this.razonDerrota = null;
  },

  addLog(mensaje, tipo = 'normal') {
    this.log.unshift({ mensaje, tipo, turno: this.turno });
    if (this.log.length > 50) this.log.pop();
  }
};
// cards.js — Definición de todos los mazos

// ── MAZO DE CASTILLO ─────────────────────────────────────────────────────
const HABITACIONES = [
  // 1 puerta (5 cartas)
  { id: 'c01', nombre: 'Cripta Sellada',         puertas: 1, tipo: 'tesoro',        efecto: 'roba2guarda1',  descripcion: 'Roba 2 Tesoros, conserva 1. Gana 1 Ruido.' },
  { id: 'c02', nombre: 'Archivo Prohibido',      puertas: 1, tipo: 'pista',         efecto: 'pista+ruido',   descripcion: 'Obtienes 1 Pista. Gana 1 Ruido.' },

// ── HELPERS ───────────────────────────────────────────────────────────────
function expandirCopias(array) {
  const resultado = [];
  array.forEach(carta => {
    const copias = carta.copias || 1;
    for (let i = 0; i < copias; i++) {
      resultado.push({ ...carta, uid: carta.id + '_' + i });
    }
  });
  return resultado;
}

function barajar(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function inicializarMazos() {
  State.mazoCastillo        = barajar([...HABITACIONES]);
  State.mazoTesoros         = barajar(expandirCopias(TESOROS));
  State.mazoAmenazas        = barajar(expandirCopias(AMENAZAS));
  State.mazoPistas          = barajar(expandirCopias(PISTAS));
  State.mazoDescubrimientos = barajar(expandirCopias(DESCUBRIMIENTOS));
  State.mazoEventosDracula  = barajar([...EVENTOS_DRACULA]);
}

function robarDeMazo(mazo) {
  if (mazo.length === 0) return null;
  return mazo.shift();
}
// map.js — Lógica del mapa y colocación

const DIRS = ['norte', 'este', 'sur', 'oeste'];
const OPUESTO = { norte: 'sur', sur: 'norte', este: 'oeste', oeste: 'este' };
const DELTA = { norte: [0, -1], sur: [0, 1], este: [1, 0], oeste: [-1, 0] };

const MapEngine = {

  // Devuelve la celda de una habitación por coordenadas
  getCelda(x, y) {
    return State.habitacionesColocadas.find(h => h.x === x && h.y === y) || null;
  },

  // Puertas abiertas de una habitación (las que dan a celda vacía)
  puertasLibres(hab) {
    const libres = [];
    for (const dir of hab.puertas_dirs) {
      const [dx, dy] = DELTA[dir];
      if (!this.getCelda(hab.x + dx, hab.y + dy)) {
        libres.push({ x: hab.x + dx, y: hab.y + dy, dir, desde: { x: hab.x, y: hab.y } });
      }
    }
    return libres;
  },

  // Todas las puertas abiertas del mapa
  todasPuertasAbiertas() {
    const abiertas = [];
    for (const hab of State.habitacionesColocadas) {
      abiertas.push(...this.puertasLibres(hab));
    }
    return abiertas;
  },

  // Asigna direcciones de puertas aleatorias según el número
  asignarDirecciones(numPuertas) {
    const dirs = barajar([...DIRS]);
    return dirs.slice(0, numPuertas);
  },

  // Coloca una habitación en (x, y) con las direcciones dadas
  colocarHabitacion(carta, x, y, puertas_dirs) {
    const nueva = {
      ...carta,
      x, y,
      puertas_dirs,
      bloqueada: false,
    };
    State.habitacionesColocadas.push(nueva);
    State.addLog(`Explorado: ${carta.nombre} (${carta.puertas} puertas)`, 'info');
    return nueva;
  },

  // Inicializa el Hall en el centro (0,0)
  inicializarHall() {
    const hall = {
      ...HALL,
      x: 0, y: 0,
      puertas_dirs: ['norte', 'sur', 'este', 'oeste'],
      bloqueada: false,
    };
    State.habitacionesColocadas = [hall];
  },

  // ¿Quedan puertas abiertas?
  hayPuertasAbiertas() {
    return this.todasPuertasAbiertas().length > 0;
  },

  // Bloquea la puerta más reciente usada
  bloquearPuertaReciente() {
    // En la implementación alpha bloqueamos marcando la última habitación colocada
    const ultimas = State.habitacionesColocadas;
    if (ultimas.length <= 1) return;
    const ultima = ultimas[ultimas.length - 1];
    ultima.bloqueada = true;
    State.addLog(`Puerta bloqueada en: ${ultima.nombre}`, 'peligro');
  },

  // Para el renderizado: obtiene el bounding box del mapa
  getBounds() {
    if (State.habitacionesColocadas.length === 0) return { minX: 0, maxX: 0, minY: 0, maxY: 0 };
    const xs = State.habitacionesColocadas.map(h => h.x);
    const ys = State.habitacionesColocadas.map(h => h.y);
    return {
      minX: Math.min(...xs),
      maxX: Math.max(...xs),
      minY: Math.min(...ys),
      maxY: Math.max(...ys),
    };
  }
};

const Effects = {

  // ── MODIFICADORES BÁSICOS ────────────────────────────────────────────

  ganarRuido(cantidad, origen = '') {
    // Reloj de sol: reduce 1 por uso (máx 3 usos)
    const reloj = State.tesoros.find(t => t.id === 't10');
    if (reloj && State.relojDeSolUsos < 3) {
      cantidad = Math.max(0, cantidad - 1);
      State.relojDeSolUsos++;
      if (State.relojDeSolUsos >= 3) {
        this.descartarTesoro('t10');
        State.addLog('Reloj de sol agotado y descartado.', 'info');
      }
    }
    State.ruido = Math.min(15, State.ruido + cantidad);
    if (origen) State.addLog(`+${cantidad} Ruido (${origen}). Ruido total: ${State.ruido}`, 'ruido');
    this.comprobarEventosDracula();
  },

  perderVida(cantidad, origen = '') {
    // Medallón protector: puede absorber hasta 2 puntos

    State.vida = Math.max(0, State.vida - cantidad);

  ganarVida(cantidad) {

    State.addLog(`+${cantidad} Vida. Vida: ${State.vida}`, 'bien');
  },

  perderDeterminacion(cantidad, origen = '') {

  ganarDeterminacion(cantidad) {

      State.enPanico = false;
      State.addLog('¡Sales del estado de Pánico!', 'bien');

    State.addLog(`−${cantidad} Ruido. Ruido total: ${State.ruido}`, 'bien');

  ganarPista(cantidad = 1) {

  // ── TESOROS ───────────────────────────────────────────────────────────

  robarTesoro() {
    const carta = robarDeMazo(State.mazoTesoros);

  descartarTesoro(id) {
    const idx = State.tesoros.findIndex(t => t.id === id || t.uid === id);

        break;
      default:
        State.addLog(`Tesoro ${tesoro.nombre} listo para usar.`, 'info');
    }
  },

  // ── RESOLUCIÓN DE HABITACIONES ────────────────────────────────────────

  resolverHabitacion(carta) {
    State.addLog(`Resolviendo: ${carta.nombre}`, 'info');
    switch (carta.efecto) {
      // 1 puerta
      case 'roba2guarda1':
        this.robarTesoro(); this.robarTesoro();
        this.ganarRuido(1, carta.nombre);
        UI.pedirDescartarTesoro(null); // si tiene >5
        break;
      case 'pista+ruido':
        this.resolverPista();
        this.ganarRuido(1, carta.nombre);
        break;
      case 'reloj':
        UI.pedirEleccion('Torre del Reloj', ['Reducir 2 Ruido', 'Ganar 2 Determinación'], (op) => {
          if (op === 0) this.reducirRuido(2);
          else this.ganarDeterminacion(2);
        });
        break;
      case 'tesoro+vida':
        this.robarTesoro();
        this.ganarVida(1);
        break;
      case 'amenaza+tesoro':
        const sobrevivio = this.resolverAmenaza();
        if (sobrevivio) this.robarTesoro();
        break;
      // Genéricas
      case 'tesoro':       this.robarTesoro(); break;
      case 'tesoro+ruido': this.ganarRuido(1, carta.nombre); this.robarTesoro(); break;
      case 'pista':        this.resolverPista(); break;
      case 'amenaza':      this.resolverAmenaza(); break;
      case 'descubrimiento': this.resolverDescubrimiento(); break;
      case 'det+1':        this.ganarDeterminacion(1); break;
      case 'ruido-1':      this.reducirRuido(1); break;
      case 'amenaza+ruido-1':
        this.resolverAmenaza();
        UI.pedirEleccion('Salón de Baile', ['Reducir 1 Ruido', 'No hacer nada'], (op) => {
          if (op === 0) this.reducirRuido(1);
        });
        break;
      case 'elige_pista_o_desc':
        UI.pedirEleccion('Atrio de las Sombras', ['Roba 1 Pista y gana 2 Ruido', 'Roba 1 Descubrimiento'], (op) => {
          if (op === 0) { this.resolverPista(); this.ganarRuido(2, 'Atrio de las Sombras'); }
          else this.resolverDescubrimiento();
        });
        break;
    }
  },

  // ── PISTAS ────────────────────────────────────────────────────────────

  resolverPista() {
    const carta = robarDeMazo(State.mazoPistas);
    if (!carta) { State.addLog('El mazo de Pistas está vacío.', 'info'); return; }
    State.addLog(`Pista robada: ${carta.nombre} — ${carta.descripcion}`, 'pista');
    switch (carta.efecto) {
      case 'pista_simple':   this.ganarPista(); break;
      case 'pista+ruido-1':  this.ganarPista(); this.reducirRuido(1); break;
      case 'pista+desc':     this.ganarPista(); this.resolverDescubrimiento(); break;
      case 'pista+det2':     this.ganarPista(); this.ganarDeterminacion(2); break;
      case 'pista+ruido+1':  this.ganarPista(); this.ganarRuido(1, carta.nombre); break;
      case 'pista_doble':
        UI.pedirEleccion('Huella en el Polvo',
          State.tesoros.length > 0 ? ['Descartar 1 Tesoro para contar como 2 Pistas', 'Contar solo como 1 Pista'] : ['Contar como 1 Pista (sin Tesoros que descartar)'],
          (op) => {
            if (op === 0 && State.tesoros.length > 0) {
              UI.pedirSeleccionTesoro('Descarta 1 Tesoro para doble Pista', (uid) => {
                this.descartarTesoro(uid);
                this.ganarPista(2);
              });
            } else {
              this.ganarPista(1);
            }
          }
        );
        break;
    }
  },

  // ── AMENAZAS ──────────────────────────────────────────────────────────

  resolverAmenaza(cartaForzada = null) {
    const carta = cartaForzada || robarDeMazo(State.mazoAmenazas);
    if (!carta) { State.addLog('El mazo de Amenazas está vacío.', 'info'); return true; }
    State.addLog(`⚔️ Amenaza: ${carta.nombre} — ${carta.descripcion}`, 'peligro');

    // Comprobar Agua bendita (cancelación total)
    const agua = State.tesoros.find(t => t.id === 't02');
    if (agua) {
      UI.pedirConfirmacion(`¿Usar Agua bendita para cancelar ${carta.nombre}?`, (si) => {
        if (si) {
          this.descartarTesoro(agua.uid);
          State.addLog('Agua bendita usada. Amenaza cancelada.', 'bien');
        } else {
          this._aplicarAmenaza(carta);
        }
        UI.renderAll();
      });
      return true; // async, se resuelve en callback
    }

    // Símbolo protector (descubrimiento guardado como flag)
    if (State.simboloProtectorActivo) {
      State.simboloProtectorActivo = false;
      const recuperaDist = ['a06', 'a07'].includes(carta.id);
      if (recuperaDist) this.ganarDistancia(1);
      State.addLog(`Símbolo protector: ${carta.nombre} ignorada.${recuperaDist ? ' +1 Distancia.' : ''}`, 'bien');
      return true;
    }

    return this._aplicarAmenaza(carta);
  },

  _aplicarAmenaza(carta) {
    // Daga de plata vs Vampiro menor
    if (carta.id === 'a01') {
      const daga = State.tesoros.find(t => t.id === 't01');
      if (daga) {
        UI.pedirConfirmacion('¿Usar Daga de plata contra el Vampiro menor?', (si) => {
          if (si) {
            this.descartarTesoro(daga.uid);
            State.addLog('Daga de plata: Vampiro menor derrotado sin daño.', 'bien');
          } else {
            this.perderVida(1, 'Vampiro menor');
          }
          UI.renderAll();
        });
        return true;
      }
    }

    // Antorcha vs Trampas
    if (['a04'].includes(carta.id)) {
      const antorcha = State.tesoros.find(t => t.id === 't06');
      if (antorcha) {
        UI.pedirConfirmacion('¿Usar Antorcha para cancelar la Trampa de cadenas?', (si) => {
          if (si) {
            this.descartarTesoro(antorcha.uid);
            State.addLog('Antorcha: Trampa cancelada.', 'bien');
          } else {
            this._efectoAmenaza(carta);
          }
          UI.renderAll();
        });
        return true;
      }
    }

    return this._efectoAmenaza(carta);
  },

  _efectoAmenaza(carta) {
    const enPanico = State.enPanico;
    switch (carta.efecto) {
      case 'vida-1':
        this.perderVida(1, carta.nombre); break;
      case 'det-1':
        this.perderDeterminacion(1, carta.nombre); break;
      case 'ruido+2':
        this.ganarRuido(2, carta.nombre); break;
      case 'vida-1+bloqueareseva':
        this.perderVida(1, carta.nombre);
        State.reservaBloqueada = true;
        State.addLog('No podrás usar la reserva el próximo turno.', 'peligro');
        break;
      case 'ruido+2+det-1':
        this.ganarRuido(2, carta.nombre);
        if (enPanico) this.perderVida(1, 'Sirviente leal (Pánico)');
        else this.perderDeterminacion(1, carta.nombre);
        break;
      case 'ruido+3+dist-1':
        this.ganarRuido(3, carta.nombre);
        this.reducirDistancia(1, carta.nombre);
        break;
      case 'vida-2+dist-1':
        this.perderVida(2, carta.nombre);
        this.reducirDistancia(1, carta.nombre);
        break;
      case 'bloquea_puerta':
        MapEngine.bloquearPuertaReciente();
        if (enPanico) this.ganarRuido(1, 'Cerrojo maldito (Pánico)');
        break;
      case 'vida-1+sintesorovida-1':
        this.perderVida(1, carta.nombre);
        if (State.tesoros.length === 0) this.perderVida(1, 'Trampa de aguja (sin Tesoros)');
        break;
    }
    // Pánico: cada amenaza suma +1 Ruido adicional
    if (enPanico) {
      this.ganarRuido(1, 'Pánico (bonificador por Amenaza)');
    }
    return !State.partidaTerminada;
  },

  // ── DESCUBRIMIENTOS ───────────────────────────────────────────────────

  resolverDescubrimiento() {
    const carta = robarDeMazo(State.mazoDescubrimientos);
    if (!carta) { State.addLog('El mazo de Descubrimientos está vacío.', 'info'); return; }
    State.addLog(`🔍 Descubrimiento: ${carta.nombre} — ${carta.descripcion}`, 'descubrimiento');
    switch (carta.efecto) {
      case 'pasaje':       State.addLog('Pasaje secreto: conecta dos puertas en el mapa.', 'info'); break;
      case 'ver_amenazas': State.addLog('Diario del prisionero: puedes reordenar las 2 primeras Amenazas.', 'info'); this._reordenarMazo(State.mazoAmenazas, 2); break;
      case 'tesoro':       this.robarTesoro(); break;
      case 'ruido-2':      this.reducirRuido(2); break;
      case 'ver_castillo': State.addLog('Voz en la niebla: puedes reordenar las 3 primeras habitaciones.', 'info'); this._reordenarMazo(State.mazoCastillo, 3); break;
      case 'mover_hab':    State.addLog('Mapa parcial: selecciona una habitación para moverla.', 'info'); break;
      case 'ruido+1':      this.ganarRuido(1, carta.nombre); break;
      case 'det+2':        this.ganarDeterminacion(2); break;
      case 'cancelar_amenaza':
        State.simboloProtectorActivo = true;
        State.addLog('Símbolo protector activo: cancelará la próxima Amenaza.', 'bien');
        break;
    }
  },

  _reordenarMazo(mazo, n) {
    // En la alpha simplemente se barajan esas cartas (el jugador no puede ver el mazo)
    const top = mazo.splice(0, n);
    const barajadas = barajar(top);
    mazo.unshift(...barajadas);
    State.addLog(`Reordenadas ${n} cartas del mazo.`, 'info');
  },

  // ── EVENTOS DE DRÁCULA ────────────────────────────────────────────────

  resolverEventoDracula() {
    const carta = robarDeMazo(State.mazoEventosDracula);
    if (!carta) {
      // Si se acaban, volver a barajar
      State.mazoEventosDracula = barajar([...EVENTOS_DRACULA]);
      return this.resolverEventoDracula();
    }

    // Espejo de bolsillo
    const espejo = State.tesoros.find(t => t.id === 't07');
    if (espejo) {
      UI.pedirConfirmacion(`¿Usar Espejo de bolsillo para cancelar "${carta.nombre}"?`, (si) => {
        if (si) {
          this.descartarTesoro(espejo.uid);
          State.addLog('Espejo de bolsillo: Evento de Drácula cancelado.', 'bien');
        } else {
          this._aplicarEventoDracula(carta);
        }
        UI.renderAll();
      });
      return;
    }

    this._aplicarEventoDracula(carta);
  },

  _aplicarEventoDracula(carta) {
    State.addLog(`🧛 EVENTO DE DRÁCULA: ${carta.nombre}`, 'dracula');
    const enPanico = State.enPanico;
    switch (carta.efecto) {
      case 'bloquea_puerta_reciente+dist-1':
        MapEngine.bloquearPuertaReciente();
        this.reducirDistancia(1, carta.nombre);
        break;
      case 'vida-2+dist-1':
        this.perderVida(2, carta.nombre);
        this.reducirDistancia(1, carta.nombre);
        break;
      case 'ruido+2+vida-1+dist-1':
        this.ganarRuido(enPanico ? 3 : 2, carta.nombre);
        this.perderVida(1, carta.nombre);
        this.reducirDistancia(1, carta.nombre);
        break;
      case 'descarta_tesoro_o_det-2':
        if (State.tesoros.length > 0) {
          UI.pedirSeleccionTesoro('Voz del maestro: descarta 1 Tesoro', (uid) => {
            this.descartarTesoro(uid);
            if (enPanico) this.perderVida(1, 'Voz del maestro (Pánico)');
            UI.renderAll();
          });
        } else {
          this.perderDeterminacion(2, carta.nombre);
          if (enPanico) this.perderVida(1, 'Voz del maestro (Pánico)');
        }
        break;
      case 'amenaza_extra+dist-1':
        const numAmenazas = enPanico ? 2 : 1;
        for (let i = 0; i < numAmenazas; i++) this.resolverAmenaza();
        this.reducirDistancia(1, carta.nombre);
        break;
      case 'vida-1+ruido+2+dist-2':
        this.perderVida(1, carta.nombre);
        this.ganarRuido(2, carta.nombre);
        this.reducirDistancia(2, carta.nombre);
        const umbral = enPanico ? 10 : 14;
        if (State.ruido >= umbral) {
          this.perderVida(2, 'Aparición (umbral de Ruido)');
        }
        break;
    }
  },

  // ── COMPROBACIONES ────────────────────────────────────────────────────

  comprobarEventosDracula() {
    const umbrales = [5, 10, 15];
    for (const u of umbrales) {
      if (State.ruido >= u && !State[`eventoDisparado_${u}`]) {
        State[`eventoDisparado_${u}`] = true;
        State.addLog(`Ruido alcanza ${u}. ¡Evento de Drácula!`, 'dracula');
        this.resolverEventoDracula();
      }
    }
  },

  comprobarDerrota() {
    if (State.partidaTerminada) return;
    if (State.vida <= 0) {
      State.partidaTerminada = true;
      State.resultado = 'derrota';
      State.razonDerrota = 'Tu Vida llegó a 0.';
      UI.mostrarFin();
    } else if (State.distanciaDracula <= 0) {
      State.partidaTerminada = true;
      State.resultado = 'derrota';
      State.razonDerrota = 'Drácula te alcanzó.';
      UI.mostrarFin();
    }
  },

  comprobarPuertasAgotadas() {
    if (!MapEngine.hayPuertasAbiertas() && !State.salidaDisponible) {
      State.partidaTerminada = true;
      State.resultado = 'derrota';
      State.razonDerrota = 'No quedan puertas abiertas. El castillo te atrapó.';
      UI.mostrarFin();
    }
  },

  // ── ACCIÓN ESPECIAL: ESCONDITE ────────────────────────────────────────

  accionEscondite() {
    if (State.accionEsconditeUsada) {
      State.addLog('Ya usaste la acción de Escondite esta partida.', 'info');
      return;
    }
    if (State.determinacion < 2) {
      State.addLog('No tienes suficiente Determinación para el Escondite (necesitas 2).', 'peligro');
      return;
    }
    State.determinacion -= 2;
    this.ganarRuido(2, 'Escondite');
    this.ganarDistancia(1);
    State.accionEsconditeUsada = true;
    State.addLog('Acción de Escondite usada. −2 Determinación, +2 Ruido, +1 Distancia de Drácula.', 'info');
  },

  // ── SALIDA ────────────────────────────────────────────────────────────

  usarSalida() {
    if (!State.salidaDisponible) {
      State.addLog('No tienes las 3 Pistas todavía.', 'peligro');
      return;
    }
    if (!MapEngine.hayPuertasAbiertas()) {
      State.addLog('No hay puertas abiertas para conectar la Salida.', 'peligro');
      return;
    }
    State.partidaTerminada = true;
    State.resultado = 'victoria';
    UI.mostrarFin();
  }
};
// engine.js — Motor de turno y flujo del juego

const Engine = {

  // ── INICIO DE PARTIDA ─────────────────────────────────────────────────

  nuevaPartida() {
    State.reset();
    inicializarMazos();
    MapEngine.inicializarHall();

    // Resetear flags de umbrales de Ruido
    State.eventoDisparado_5  = false;
    State.eventoDisparado_10 = false;
    State.eventoDisparado_15 = false;

    State.simboloProtectorActivo = false;

    State.addLog('🏰 Partida iniciada. Estás en el Hall. El castillo aguarda...', 'inicio');
    State.faseActual = 'explorar';
    UI.renderAll();
  },

  // ── FLUJO DE TURNO ────────────────────────────────────────────────────

  iniciarTurno() {
    if (State.partidaTerminada) return;
    State.descartadoEsteTurno = false;
    State.faseActual = 'explorar';
    State.addLog(`── Turno ${State.turno} ──`, 'turno');
    UI.renderAll();
  },

  // Paso 1-3: El jugador elige qué hacer con la habitación robada
  robarHabitacion() {
    if (State.mazoCastillo.length === 0) {
      State.addLog('El mazo de Castillo está vacío.', 'info');
      return null;
    }
    const carta = robarDeMazo(State.mazoCastillo);
    State.addLog(`Habitación robada: ${carta.nombre} (${carta.puertas} puerta${carta.puertas > 1 ? 's' : ''})`, 'info');
    return carta;
  },

  // Colocar habitación en el mapa
  colocarHabitacion(carta) {
    if (!MapEngine.hayPuertasAbiertas()) {
      Effects.comprobarPuertasAgotadas();
      return false;
    }
    const dirs = MapEngine.asignarDirecciones(carta.puertas);
    const puertas = MapEngine.todasPuertasAbiertas();
    if (puertas.length === 0) return false;

    // Auto-colocar en la primera puerta disponible (alpha: el jugador elige en UI)
    const puerta = puertas[0];
    MapEngine.colocarHabitacion(carta, puerta.x, puerta.y, dirs);
    return true;
  },

  // Guardar en reserva
  guardarEnReserva(carta) {
    if (State.reservaBloqueada) {
      State.addLog('La reserva está bloqueada este turno (Trampa de cadenas).', 'peligro');
      return false;
    }
    if (State.reserva.length >= 2) {
      State.addLog('La reserva está llena (máximo 2 habitaciones).', 'info');
      return false;
    }
    State.reserva.push(carta);
    State.addLog(`Guardado en reserva: ${carta.nombre}`, 'info');
    return true;
  },

  // Descartar habitación (+2 Ruido, roba otra)
  descartarHabitacion(carta) {
    if (State.descartadoEsteTurno) {
      State.addLog('Ya descartaste una habitación este turno.', 'peligro');
      return null;
    }
    State.descartadoEsteTurno = true;
    State.pilaDescarte.push(carta);
    Effects.ganarRuido(2, 'descarte de habitación');
    State.addLog(`Descartado: ${carta.nombre}. +2 Ruido. Robando otra habitación...`, 'ruido');
    const nueva = this.robarHabitacion();
    return nueva; // Esta segunda carta debe colocarse o guardarse, no puede descartarse
  },

  // Usar habitación de la reserva
  usarDeReserva(idx) {
    if (State.reservaBloqueada) {
      State.addLog('La reserva está bloqueada este turno.', 'peligro');
      return null;
    }
    if (idx < 0 || idx >= State.reserva.length) return null;
    const carta = State.reserva.splice(idx, 1)[0];
    State.addLog(`Usada de la reserva: ${carta.nombre}`, 'info');
    return carta;
  },

  // Paso 4-6: Resolver contenido + Ruido + posible Evento
  finalizarTurno(cartaColocada) {
    if (State.partidaTerminada) return;

    // Resolver contenido de la habitación
    if (cartaColocada && cartaColocada.efecto) {
      Effects.resolverHabitacion(cartaColocada);
    }

    if (State.partidaTerminada) return;

    // +1 Ruido por turno
    Effects.ganarRuido(1, 'fin de turno');

    if (State.partidaTerminada) return;

    // Comprobar si quedan puertas
    Effects.comprobarPuertasAgotadas();

    if (State.partidaTerminada) return;

    // Limpiar bloqueo de reserva si era de turno anterior
    if (State._limpiarReservaSiguienteTurno) {
      State.reservaBloqueada = false;
      State._limpiarReservaSiguienteTurno = false;
    }
    if (State.reservaBloqueada) {
      State._limpiarReservaSiguienteTurno = true;
    }

    State.turno++;
    this.iniciarTurno();
  }
};
// ui.js — Renderizado e interfaz

const UI = {

  // Cola de modales pendientes
  _modalQueue: [],
  _modalActivo: false,

  // ── RENDER PRINCIPAL ─────────────────────────────────────────────────

  renderAll() {
    this.renderTracks();
    this.renderMapa();
    this.renderInventario();
    this.renderLog();
    this.renderAcciones();
  },

  // ── TRACKS DE RECURSOS ────────────────────────────────────────────────

  renderTracks() {
    this._setPips('pips-vida', State.vida, 5, 'pip-vida');
    this._setPips('pips-det', State.determinacion, 5, 'pip-det');
    this._setTrackNum('track-ruido', State.ruido, 15, State.ruido >= 12 ? 'danger' : State.ruido >= 7 ? 'warn' : '');
    this._setTrackNum('track-dist', State.distanciaDracula, 5, State.distanciaDracula <= 1 ? 'danger' : State.distanciaDracula <= 2 ? 'warn' : '');
    this._setCounter('counter-pistas', State.pistas, 3);
    this._setCounter('counter-turno', State.turno, null);

    const panico = document.getElementById('estado-panico');
    if (panico) panico.classList.toggle('visible', State.enPanico);

    const salidaBtn = document.getElementById('btn-salida');
    if (salidaBtn) salidaBtn.classList.toggle('activa', State.salidaDisponible);
  },

  _setPips(id, valor, max, cls) {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = '';
    for (let i = 0; i < max; i++) {
      const pip = document.createElement('div');
      pip.className = `pip ${cls} ${i < valor ? 'activo' : 'inactivo'}`;
      el.appendChild(pip);
    }
  },

  _setTrackNum(id, valor, max, cls) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = valor;
    el.className = `track-num ${cls}`;
  },

  _setCounter(id, valor, max) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = max ? `${valor}/${max}` : valor;
  },

  // ── MAPA ──────────────────────────────────────────────────────────────

  renderMapa() {
    const canvas = document.getElementById('mapa-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const CELL = 72;
    const bounds = MapEngine.getBounds();
    const offsetX = W / 2 - ((bounds.maxX + bounds.minX) / 2) * CELL;
    const offsetY = H / 2 - ((bounds.maxY + bounds.minY) / 2) * CELL;

    // Dibujar conexiones (puertas entre habitaciones)
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 2;
    for (const hab of State.habitacionesColocadas) {
      for (const dir of (hab.puertas_dirs || [])) {
        const [dx, dy] = [[0,-1],[1,0],[0,1],[-1,0]][['norte','este','sur','oeste'].indexOf(dir)];
        const vecino = MapEngine.getCelda(hab.x + dx, hab.y + dy);
        if (vecino) {
          const x1 = offsetX + hab.x * CELL + CELL / 2;
          const y1 = offsetY + hab.y * CELL + CELL / 2;
          const x2 = offsetX + vecino.x * CELL + CELL / 2;
          const y2 = offsetY + vecino.y * CELL + CELL / 2;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
      }
    }

    // Dibujar habitaciones
    for (const hab of State.habitacionesColocadas) {
      const cx = offsetX + hab.x * CELL;
      const cy = offsetY + hab.y * CELL;
      this._dibujarHabitacion(ctx, hab, cx, cy, CELL);
    }

    // Dibujar puertas abiertas (indicadores)
    const abiertas = MapEngine.todasPuertasAbiertas();
    for (const p of abiertas) {
      const cx = offsetX + p.x * CELL + CELL / 2;
      const cy = offsetY + p.y * CELL + CELL / 2;
      ctx.beginPath();
      ctx.arc(cx, cy, 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(184, 134, 11, 0.5)';
      ctx.fill();
      ctx.strokeStyle = '#b8860b';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  },

  _dibujarHabitacion(ctx, hab, cx, cy, CELL) {
    const pad = 4;
    const colores = {
      inicio:          { bg: '#2a1a0a', borde: '#b8860b', texto: '#f0e6d3' },
      tesoro:          { bg: '#1a2a0a', borde: '#4a7a1a', texto: '#c8e0a0' },
      amenaza:         { bg: '#2a0a0a', borde: '#8b0000', texto: '#f0c0a0' },
      pista:           { bg: '#0a1a2a', borde: '#1a5a8b', texto: '#a0c8f0' },
      descubrimiento:  { bg: '#1a0a2a', borde: '#5a1a8b', texto: '#d0a0f0' },
      vacia:           { bg: '#1a1a1a', borde: '#4a4a4a', texto: '#aaaaaa' },
      mixta:           { bg: '#2a1a0a', borde: '#8b6a00', texto: '#f0d080' },
    };
    const col = colores[hab.tipo] || colores.vacia;

    // Fondo
    ctx.fillStyle = col.bg;
    ctx.strokeStyle = hab.bloqueada ? '#ff0000' : col.borde;
    ctx.lineWidth = hab.id === 'hall' ? 3 : 2;
    ctx.beginPath();
    ctx.roundRect(cx + pad, cy + pad, CELL - pad * 2, CELL - pad * 2, 4);
    ctx.fill();
    ctx.stroke();

    // Nombre (truncado)
    ctx.fillStyle = col.texto;
    ctx.font = `bold ${hab.id === 'hall' ? 9 : 7.5}px Georgia`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const nombre = hab.nombre.length > 12 ? hab.nombre.slice(0, 11) + '…' : hab.nombre;
    ctx.fillText(nombre, cx + CELL / 2, cy + CELL / 2 - 6);

    // Número de puertas
    ctx.font = '8px Georgia';
    ctx.fillStyle = col.borde;
    ctx.fillText(`${hab.puertas}🚪`, cx + CELL / 2, cy + CELL / 2 + 8);

    // Indicador bloqueada
    if (hab.bloqueada) {
      ctx.fillStyle = '#ff4444';
      ctx.font = '10px sans-serif';
      ctx.fillText('🔒', cx + CELL - 14, cy + 14);
    }
  },

  // ── INVENTARIO ────────────────────────────────────────────────────────

  renderInventario() {
    // Tesoros
    const tesorosEl = document.getElementById('lista-tesoros');
    if (tesorosEl) {
      tesorosEl.innerHTML = '';
      if (State.tesoros.length === 0) {
        tesorosEl.innerHTML = '<div class="empty-slot">Sin tesoros</div>';
      } else {
        State.tesoros.forEach(t => {
          const div = document.createElement('div');
          div.className = 'carta-tesoro';
          div.innerHTML = `<span class="carta-nombre">${t.nombre}</span><span class="carta-desc">${t.descripcion}</span>`;
          div.addEventListener('click', () => this._onClickTesoro(t));
          tesorosEl.appendChild(div);
        });
      }
    }

    // Reserva
    const reservaEl = document.getElementById('lista-reserva');
    if (reservaEl) {
      reservaEl.innerHTML = '';
      if (State.reserva.length === 0) {
        reservaEl.innerHTML = '<div class="empty-slot">Reserva vacía</div>';
      } else {
        State.reserva.forEach((h, i) => {
          const div = document.createElement('div');
          div.className = 'carta-reserva';
          div.innerHTML = `<span class="carta-nombre">${h.nombre}</span><span class="carta-puertas">${h.puertas}🚪</span>`;
          div.addEventListener('click', () => {
            const carta = Engine.usarDeReserva(i);
            if (carta) {
              Game.cartaActual = carta;
              Game.segundaCarta = true;
              this.mostrarCartaRobada(carta);
            }
          });
          reservaEl.appendChild(div);
        });
      }
    }
  },

  // ── ACCIONES ──────────────────────────────────────────────────────────

  renderAcciones() {
    const zona = document.getElementById('zona-acciones');
    if (!zona) return;
    zona.innerHTML = '';

    if (State.partidaTerminada) return;

    const fase = State.faseActual;

    if (fase === 'explorar') {
      this._boton(zona, '🚪 Explorar habitación', 'btn-primary', () => Game.explorar());
      if (State.reserva.length > 0 && !State.reservaBloqueada) {
        this._boton(zona, `📦 Usar reserva (${State.reserva.length})`, 'btn-secondary', () => Game.usarReserva());
      }
      if (State.salidaDisponible) {
        this._boton(zona, '🚗 USAR SALIDA — ¡ESCAPAR!', 'btn-victoria', () => Effects.usarSalida());
      }
      if (!State.accionEsconditeUsada) {
        this._boton(zona, '🙈 Escondite (−2 Det, +2 Ruido, +1 Dist)', 'btn-especial', () => Effects.accionEscondite());
      }
    }

    if (fase === 'colocar') {
      this._boton(zona, '✅ Colocar habitación', 'btn-primary', () => Game.confirmarColocar());
      if (!State.reservaBloqueada && State.reserva.length < 2) {
        this._boton(zona, '📥 Guardar en reserva', 'btn-secondary', () => Game.guardarEnReserva());
      }
      if (!State.descartadoEsteTurno) {
        this._boton(zona, '🗑️ Descartar (+2 Ruido)', 'btn-danger', () => Game.descartar());
      }
    }

    UI.renderAll();
  },

  _boton(padre, texto, cls, onClick) {
    const btn = document.createElement('button');
    btn.className = `btn ${cls}`;
    btn.textContent = texto;
    btn.addEventListener('click', onClick);
    padre.appendChild(btn);
  },

  // ── CARTA ROBADA ──────────────────────────────────────────────────────

  mostrarCartaRobada(carta) {
    const panel = document.getElementById('panel-carta');
    if (!panel) return;
    const iconos = { tesoro: '💰', amenaza: '⚔️', pista: '🔑', descubrimiento: '🔍', vacia: '🫥', mixta: '⚡', inicio: '🏰' };
    panel.innerHTML = `
      <div class="carta-robada tipo-${carta.tipo}">
        <div class="carta-icono">${iconos[carta.tipo] || '?'}</div>
        <div class="carta-titulo">${carta.nombre}</div>
        <div class="carta-puertas">${carta.puertas} puerta${carta.puertas > 1 ? 's' : ''}</div>
        <div class="carta-desc-panel">${carta.descripcion}</div>
      </div>
    `;
    panel.classList.add('visible');
    State.faseActual = 'colocar';
    this.renderAcciones();
  },

  ocultarCartaRobada() {
    const panel = document.getElementById('panel-carta');
    if (panel) panel.classList.remove('visible');
  },

  // ── LOG ───────────────────────────────────────────────────────────────

  renderLog() {
    const logEl = document.getElementById('log-contenido');
    if (!logEl) return;
    logEl.innerHTML = '';
    State.log.slice(0, 30).forEach(entrada => {
      const div = document.createElement('div');
      div.className = `log-entrada log-${entrada.tipo}`;
      div.textContent = entrada.mensaje;
      logEl.appendChild(div);
    });
  },

  // ── FIN DE PARTIDA ────────────────────────────────────────────────────

  mostrarFin() {
    const overlay = document.getElementById('overlay-fin');
    if (!overlay) return;
    const titulo = document.getElementById('fin-titulo');
    const subtitulo = document.getElementById('fin-subtitulo');
    if (State.resultado === 'victoria') {
      titulo.textContent = '¡Has escapado!';
      titulo.className = 'fin-titulo victoria';
      subtitulo.textContent = 'Conectaste la Puerta de Carruajes y huiste del castillo.';
    } else {
      titulo.textContent = 'El castillo te venció';
      titulo.className = 'fin-titulo derrota';
      subtitulo.textContent = State.razonDerrota || 'La oscuridad te engulló.';
    }
    overlay.classList.add('visible');
  },

  // ── MODALES ───────────────────────────────────────────────────────────

  pedirEleccion(titulo, opciones, callback) {
    this._mostrarModal({
      titulo,
      tipo: 'eleccion',
      opciones,
      callback
    });
  },

  pedirConfirmacion(mensaje, callback) {
    this._mostrarModal({
      titulo: mensaje,
      tipo: 'confirmar',
      opciones: ['Sí', 'No'],
      callback: (idx) => callback(idx === 0)
    });
  },

  pedirDescartarTesoro(tesoroNuevo) {
    if (State.tesoros.length <= 5) return;
    const opciones = State.tesoros.map(t => t.nombre);
    this._mostrarModal({
      titulo: 'Inventario lleno. ¿Qué Tesoro descartas?',
      tipo: 'eleccion',
      opciones,
      callback: (idx) => {
        Effects.descartarTesoro(State.tesoros[idx].uid);
        if (tesoroNuevo) {
          State.tesoros.push(tesoroNuevo);
        }
        UI.renderAll();
      }
    });
  },

  pedirSeleccionTesoro(titulo, callback) {
    if (State.tesoros.length === 0) return;
    const opciones = State.tesoros.map(t => t.nombre);
    this._mostrarModal({
      titulo,
      tipo: 'eleccion',
      opciones,
      callback: (idx) => callback(State.tesoros[idx].uid)
    });
  },

  _mostrarModal(config) {
    const overlay = document.getElementById('modal-overlay');
    const titulo  = document.getElementById('modal-titulo');
    const btns    = document.getElementById('modal-botones');
    if (!overlay) return;

    titulo.textContent = config.titulo;
    btns.innerHTML = '';

    config.opciones.forEach((op, i) => {
      const btn = document.createElement('button');
      btn.className = `btn btn-modal ${i === 0 ? 'btn-primary' : 'btn-secondary'}`;
      btn.textContent = op;
      btn.addEventListener('click', () => {
        overlay.classList.remove('visible');
        if (config.callback) config.callback(i);
        UI.renderAll();
      });
      btns.appendChild(btn);
    });

    overlay.classList.add('visible');
  },

  _onClickTesoro(tesoro) {
    if (tesoro.pasivo) {
      this.pedirEleccion(`${tesoro.nombre}`, [`${tesoro.descripcion}`, 'Cerrar'], () => {});
    } else {
      this.pedirConfirmacion(`¿Usar ${tesoro.nombre}?\n${tesoro.descripcion}`, (si) => {
        if (si) Effects.usarTesoro(tesoro.uid);
        UI.renderAll();
      });
    }
  }
};

// ── GAME CONTROLLER ───────────────────────────────────────────────────────
// Gestiona la carta actual en vuelo

const Game = {
  cartaActual: null,
  segundaCarta: false,  // true = carta robada tras descartar (no puede volver a descartarse)

  explorar() {
    this.cartaActual = Engine.robarHabitacion();
    if (!this.cartaActual) return;
    this.segundaCarta = false;
    UI.mostrarCartaRobada(this.cartaActual);
  },

  usarReserva() {
    if (State.reserva.length === 0) return;
    // Si hay más de una carta en reserva, preguntar cuál
    if (State.reserva.length === 1) {
      this.cartaActual = Engine.usarDeReserva(0);
    } else {
      UI.pedirEleccion('¿Qué habitación usas de la reserva?',
        State.reserva.map(h => `${h.nombre} (${h.puertas}🚪)`),
        (idx) => {
          this.cartaActual = Engine.usarDeReserva(idx);
          this.segundaCarta = true;
          if (this.cartaActual) UI.mostrarCartaRobada(this.cartaActual);
        }
      );
      return;
    }
    this.segundaCarta = true;
    if (this.cartaActual) UI.mostrarCartaRobada(this.cartaActual);
  },

  confirmarColocar() {
    if (!this.cartaActual) return;
    const ok = Engine.colocarHabitacion(this.cartaActual);
    if (!ok) {
      State.addLog('No hay espacio válido para colocar la habitación.', 'peligro');
      return;
    }
    const carta = this.cartaActual;
    this.cartaActual = null;
    this.segundaCarta = false;
    UI.ocultarCartaRobada();
    Engine.finalizarTurno(carta);
  },

  guardarEnReserva() {
    if (!this.cartaActual) return;
    const ok = Engine.guardarEnReserva(this.cartaActual);
    if (!ok) return;
    this.cartaActual = null;
    this.segundaCarta = false;
    UI.ocultarCartaRobada();
    // Tras guardar en reserva, el turno sigue sin resolver habitación
    // → El jugador debe explorar de nuevo o terminar turno
    State.faseActual = 'explorar';
    Engine.finalizarTurno(null);
  },

  descartar() {
    if (!this.cartaActual) return;
    if (this.segundaCarta) {
      State.addLog('Esta carta no puede descartarse (es la segunda robada).', 'peligro');
      return;
    }
    const nueva = Engine.descartarHabitacion(this.cartaActual);
    if (!nueva) return;
    this.cartaActual = nueva;
    this.segundaCarta = true;
    UI.mostrarCartaRobada(nueva);
  }
};
// main.js — Arranque e inicialización

document.addEventListener('DOMContentLoaded', () => {
  // Botón nueva partida
  document.getElementById('btn-nueva-partida')?.addEventListener('click', () => {
    document.getElementById('overlay-fin')?.classList.remove('visible');
    Engine.nuevaPartida();
  });

  // Botón reiniciar desde overlay de fin
  document.getElementById('btn-reiniciar')?.addEventListener('click', () => {
    document.getElementById('overlay-fin')?.classList.remove('visible');
    Engine.nuevaPartida();
  });

  // Canvas de mapa — click para seleccionar puerta
  const canvas = document.getElementById('mapa-canvas');
  if (canvas) {
    canvas.addEventListener('click', (e) => {
      if (!Game.cartaActual || State.faseActual !== 'colocar') return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      MapEngine._ultimoClick = { x, y };
    });

    // Resize canvas
    function resizeCanvas() {
      const container = canvas.parentElement;
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      UI.renderMapa();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  }

  // Arrancar partida automáticamente
  Engine.nuevaPartida();
});

// Ajuste dinámico de contadores
const _origRenderInventario = UI.renderInventario.bind(UI);
UI.renderInventario = function() {
  _origRenderInventario();
  const tEl = document.querySelector('.panel-derecho .panel-seccion:nth-child(1) .seccion-titulo');
  const rEl = document.querySelector('.panel-derecho .panel-seccion:nth-child(2) .seccion-titulo');
  if (tEl) tEl.textContent = '💰 Tesoros (' + State.tesoros.length + '/5)';
  if (rEl) rEl.textContent = '📦 Reserva (' + State.reserva.length + '/2)';
  const salidaBtn = document.getElementById('btn-salida');
  if (salidaBtn) salidaBtn.style.display = State.salidaDisponible ? 'block' : 'none';
};
