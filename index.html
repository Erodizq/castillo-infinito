<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Castillo Infinito de Drácula</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- CABECERA -->
  <header>
    <div>
      <span class="titulo-juego">El Castillo Infinito de Drácula</span>
      <span class="titulo-proto">— Alpha 0.1</span>
    </div>
    <button id="btn-nueva-partida">↺ Nueva partida</button>
  </header>

  <!-- APP PRINCIPAL -->
  <div class="app">

    <!-- PANEL IZQUIERDO: RECURSOS -->
    <aside class="panel-recursos">

      <div class="seccion-titulo">Recursos</div>

      <!-- Vida -->
      <div class="recurso">
        <div class="recurso-label">❤️ Vida</div>
        <div class="pips" id="pips-vida"></div>
      </div>

      <!-- Determinación -->
      <div class="recurso">
        <div class="recurso-label">🔵 Determinación</div>
        <div class="pips" id="pips-det"></div>
      </div>

      <!-- Estado Pánico -->
      <div id="estado-panico">⚠️ PÁNICO</div>

      <!-- Ruido -->
      <div class="recurso">
        <div class="recurso-label">🔔 Ruido</div>
        <div class="track-num" id="track-ruido">0</div>
        <div class="recurso-sublabel">Evento en 5 / 10 / 15</div>
      </div>

      <!-- Distancia Drácula -->
      <div class="recurso">
        <div class="recurso-label">🧛 Distancia de Drácula</div>
        <div class="track-num" id="track-dist">5</div>
        <div class="recurso-sublabel">Pierde si llega a 0</div>
      </div>

      <!-- Pistas y Turno -->
      <div class="counters">
        <div class="counter">
          <div class="counter-val" id="counter-pistas">0/3</div>
          <div class="counter-label">🔑 Pistas</div>
        </div>
        <div class="counter">
          <div class="counter-val" id="counter-turno">1</div>
          <div class="counter-label">Turno</div>
        </div>
      </div>

      <!-- Botón Salida -->
      <button id="btn-salida" class="btn btn-victoria" style="display:none"
        onclick="Effects.usarSalida()">
        🚗 Usar Salida
      </button>

    </aside>

    <!-- ZONA CENTRAL: MAPA -->
    <main class="zona-central">

      <div class="mapa-wrapper">
        <canvas id="mapa-canvas"></canvas>
      </div>

      <!-- Carta robada actual -->
      <div id="panel-carta"></div>

      <!-- Botones de acción -->
      <div id="zona-acciones"></div>

    </main>

    <!-- PANEL DERECHO: INVENTARIO + LOG -->
    <aside class="panel-derecho">

      <!-- Tesoros -->
      <div class="panel-seccion" style="max-height: 200px">
        <div class="seccion-titulo">💰 Tesoros (0/5)</div>
        <div id="lista-tesoros"></div>
      </div>

      <!-- Reserva -->
      <div class="panel-seccion" style="max-height: 120px">
        <div class="seccion-titulo">📦 Reserva (0/2)</div>
        <div id="lista-reserva"></div>
      </div>

      <!-- Log -->
      <div class="panel-seccion-log">
        <div class="seccion-titulo">📜 Registro</div>
        <div id="log-contenido"></div>
      </div>

    </aside>

  </div>

  <!-- MODAL DE ELECCIÓN -->
  <div id="modal-overlay">
    <div class="modal-caja">
      <div id="modal-titulo"></div>
      <div id="modal-botones"></div>
    </div>
  </div>

  <!-- OVERLAY FIN DE PARTIDA -->
  <div id="overlay-fin">
    <div class="fin-caja">
      <div id="fin-titulo" class="fin-titulo"></div>
      <div id="fin-subtitulo"></div>
      <button id="btn-reiniciar" class="btn btn-primary">↺ Jugar de nuevo</button>
    </div>
  </div>

  <!-- SCRIPTS (orden de dependencias) -->
  <script src="js/state.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/map.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>

  <!-- Ajuste dinámico del contador de tesoros/reserva en el título -->
  <script>
    const _origRenderInventario = UI.renderInventario.bind(UI);
    UI.renderInventario = function() {
      _origRenderInventario();
      const tEl = document.querySelector('.panel-derecho .panel-seccion:nth-child(1) .seccion-titulo');
      const rEl = document.querySelector('.panel-derecho .panel-seccion:nth-child(2) .seccion-titulo');
      if (tEl) tEl.textContent = `💰 Tesoros (${State.tesoros.length}/5)`;
      if (rEl) rEl.textContent = `📦 Reserva (${State.reserva.length}/2)`;

      // Mostrar/ocultar botón de Salida
      const salidaBtn = document.getElementById('btn-salida');
      if (salidaBtn) salidaBtn.style.display = State.salidaDisponible ? 'block' : 'none';
    };
  </script>

</body>
</html>
